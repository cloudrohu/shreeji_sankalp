{% extends "home/base.html" %}

{% block content %}

<style>
    .disclaimer-content {
        color: #475569;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 15px;
        line-height: 1.9;
        overflow-wrap: anywhere;
        word-break: normal;
    }

    /* Main headings */
    .disclaimer-content h1 {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 800;
        color: #172033;
        line-height: 1.25;
        margin: 40px 0 20px;
        letter-spacing: -0.8px;
    }

    .disclaimer-content h2 {
        font-size: clamp(22px, 3vw, 30px);
        font-weight: 750;
        color: #172033;
        line-height: 1.35;
        margin: 38px 0 16px;
        padding-left: 16px;
        border-left: 4px solid #c89b2c;
    }

    .disclaimer-content h3 {
        font-size: 20px;
        font-weight: 700;
        color: #273449;
        margin: 28px 0 12px;
        line-height: 1.5;
    }

    .disclaimer-content h4,
    .disclaimer-content h5,
    .disclaimer-content h6 {
        color: #273449;
        font-weight: 700;
        margin: 24px 0 10px;
    }

    /* Paragraphs */
    .disclaimer-content p {
        margin: 0 0 18px;
        color: #596579;
    }

    .disclaimer-content strong,
    .disclaimer-content b {
        color: #263348;
        font-weight: 700;
    }

    /* Lists */
    .disclaimer-content ul,
    .disclaimer-content ol {
        margin: 18px 0 24px;
        padding-left: 28px;
        color: #596579;
    }

    .disclaimer-content ul {
        list-style-type: disc;
    }

    .disclaimer-content ol {
        list-style-type: decimal;
    }

    .disclaimer-content li {
        padding-left: 5px;
        margin-bottom: 10px;
    }

    .disclaimer-content li::marker {
        color: #c89b2c;
        font-weight: 700;
    }

    .disclaimer-content li > p {
        margin-bottom: 8px;
    }

    /* Links */
    .disclaimer-content a {
        color: #a77b13;
        text-decoration: underline;
        text-underline-offset: 4px;
        overflow-wrap: anywhere;
        transition: color .2s ease;
    }

    .disclaimer-content a:hover {
        color: #78570b;
    }

    /* Images */
    .disclaimer-content img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 14px;
        margin: 24px auto;
        box-shadow: 0 8px 28px rgba(15, 23, 42, .09);
    }

    /* Tables */
    .disclaimer-content table {
        width: 100%;
        max-width: 100%;
        border-collapse: collapse;
        margin: 24px 0;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .disclaimer-content th {
        background: #f5f1e7;
        color: #273449;
        font-weight: 700;
        text-align: left;
    }

    .disclaimer-content th,
    .disclaimer-content td {
        border: 1px solid #e5e7eb;
        padding: 12px 15px;
        vertical-align: top;
    }

    .disclaimer-content tr:nth-child(even) td {
        background: #fafaf9;
    }

    /* Blockquote */
    .disclaimer-content blockquote {
        margin: 28px 0;
        padding: 22px 24px;
        border-left: 4px solid #c89b2c;
        border-radius: 0 12px 12px 0;
        background: #faf7ef;
        color: #475569;
        font-size: 16px;
        font-style: italic;
    }

    .disclaimer-content blockquote p:last-child {
        margin-bottom: 0;
    }

    /* Horizontal line */
    .disclaimer-content hr {
        border: 0;
        border-top: 1px solid #e5e7eb;
        margin: 32px 0;
    }

    /* CKEditor alignment */
    .disclaimer-content .text-align-center,
    .disclaimer-content [style*="text-align: center"] {
        text-align: center;
    }

    .disclaimer-content [style*="text-align: right"] {
        text-align: right;
    }

    .disclaimer-content [style*="text-align: justify"] {
        text-align: justify;
    }

    /* Mobile */
    @media (max-width: 640px) {
        .disclaimer-content {
            font-size: 14px;
            line-height: 1.8;
        }

        .disclaimer-content h1 {
            margin-top: 28px;
        }

        .disclaimer-content h2 {
            margin-top: 30px;
            padding-left: 12px;
        }

        .disclaimer-content h3 {
            font-size: 18px;
        }

        .disclaimer-content table {
            display: block;
            overflow-x: auto;
        }

        .disclaimer-content th,
        .disclaimer-content td {
            padding: 10px;
            min-width: 110px;
        }
    }
</style>

<section class="py-8 sm:py-12 mt-16">
    <div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8">
        <div class="rounded-2xl border border-[#e5e0d6] bg-white p-5 sm:p-8 lg:p-10">
            <div class="border-b border-[#e5e0d6] pb-6 sm:pb-8">
                <p class="text-[10px] font-semibold uppercase tracking-[0.22em] text-[#b89252] sm:text-xs">Legal</p>
                <h1 class="mt-2 text-2xl font-bold tracking-tight text-gray-900 sm:text-4xl">
                    {{ settings_obj.disclaimer_title }}
                </h1>
            </div>

            <div class="disclaimer-content prose prose-sm mt-6 max-w-none text-gray-600 sm:prose-base sm:mt-8">
                {{ settings_obj.disclaimer_content|safe }}
            </div>
        </div>
    </div>
</section>

{% endblock content %}
